<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Elatyeb Ali Abdalla Mohamed">
    <title>First Aid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #343a40;
            line-height: 1.6;
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
        }
        .slide {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #ffffff;
        }
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .controls button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        #slideInput {
            width: 60px;
            text-align: center;
            margin: 5px;
        }
        .feedback {
            margin-top: 10px;
            font-size: 18px;
            text-align: center;
        }
        .translation-area {
            width: 100%;
            height: 100px;
            margin-top: 10px;
        }
        .arabic {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 2.2em;
            color: blue;
        }
        .english {
            font-family: 'Arial', sans-serif;
            font-size: 2.2em;
            color: red;
        }
    </style>
</head>
<body>

<h3>Q SKILLS INTRO LS<br> Page 109</h3>
<div class="slide"></div>

<audio id="audioPlayer" controls></audio>

<div class="controls">
    <button onclick="previousSlide()">
        <img src="backward.png" alt="Previous" style="width: 20px; height: 20px;">
    </button>
    <button onclick="nextSlide()">
        <img src="forward.png" alt="Next" style="width: 20px; height: 20px;">
    </button>
    <input type="number" id="slideInput" min="1" max="4" placeholder="Slide" />
    <button onclick="goToSlide()">&#128269;</button>
    <button onclick="checkAnswer()">Check</button>
    <span class="feedback" id="feedback"></span>
</div>

<!-- Text area for user translation -->
<textarea id="userTranslation" class="translation-area" placeholder="Look at the Arabic. Translate into English and check."></textarea>

<script>
    let utterance = new SpeechSynthesisUtterance();
    const Items = [
    {
            audio: "Hi every one.mp3",
            English: "Hi everyone.",
            translation: "مرحبًا بالجميع",

            
        },
        {
            audio: "You are listening to health corner.mp3",
            English: "You are listening to Health Corner.",
            translation: "أنت تستمع إلى ركن الصحة",
            
            
        },
        {
            audio: "I am Gina.mp3",
            English: "I am Gina.",
            translation: "أنا جينا",
            
        },
        {
            audio:"and my guest is nutrition expert Tran Pham.mp3",
            English: "and my guest is nutrition expert Tran Pham.",
            translation: "وضيفتي هي خبيرة التغذية تران فام",
        },
        {
            audio: "Today we are talking about vitamin supplements.mp3",
            English: "Today we are talking about vitamin supplements.",
            translation: "اليوم نتحدث عن مكملات الفيتامينات",
            
        },
        {
            audio: "Thank you for joining us, Tran.mp3",
            English: "Thank you for joining us, Tran.",
            translation: "شكرًا لانضمامك إلينا، تران",
            
        },
        {
            audio: "Thanks, Gina.mp3",
            English: "Thanks, Gina.",
            translation: "شكرًا، جينا  ",
            
        },
        
        {
            audio: "I am happy to be here.mp3",
            English: "I am happy to be here.",
            translation: "أنا سعيد بوجودي هنا",
            
        },
        {
            audio: "So Tran.mp3",
            English: "So Tran.",
            translation: "لذا، تران",
            
        },
        {
            audio:"do you really need to take supplements.mp3",
            English: "Do you really need to take supplements?",
            translation: "هل تحتاج حقًا إلى تناول المكملات الغذائية؟",
            
        },
        {
            audio:"to be healthy.mp3",
            English: "to be healthy.",
            translation: "لتكون بصحة جيدة",
            
        },
       
        {
            audio: "do you really need to take supplements to be healthy.mp3",
            English: "Do you really need to take supplements to be healthy?",   
            translation: "هل تحتاج حقًا إلى تناول المكملات الغذائية لتكون بصحة جيدة؟",
            
        },
        {
            audio:"Well.mp3",
            English: "Well.",
            translation: "حسنًا",
            
        },
        
        
        {
            audio: "It depends on your diet.mp3",
            English: "It depends on your diet.",
            translation: "يعتمد ذلك على نظامك الغذائي",
            
        },
        {
            audio: "If you have a balanced diet.mp3",
            English: "If you have a balanced diet.",
            translation: "إذا كان لديك نظام غذائي متوازن",
            
        },
        {
            audio: "you probably do not need to take supplements.mp3",
            English: "you probably do not need to take supplements.",
            translation: "فربما لا تحتاج إلى تناول المكملات الغذائية",

            
        },
        {
            audio: "you can get all the vitamins that you need from the food you eat.mp3",
            English: "You can get all the vitamins that you need from the food you eat.",
            translation: "يمكنك الحصول على جميع الفيتامينات التي تحتاجها من الطعام الذي تأكله",
            
        },
        {
            audio: "I see.mp3",
            English: "I see.",
            translation: "أرى",
        },
        {
            audio: "and what does a balanced diet include.mp3",
            English: "and what does a balanced diet include?",
            translation: "وماذا يتضمن النظام الغذائي المتوازن؟",
            
        },
        {
            audio:"That is a good question.mp3",
            English: "That is a good question.",
            translation: "هذا سؤال جيد",
            
        },

        {
            audio: "Of course, it includes fruits and vegetables.mp3",
            English: "Of course, it includes fruits and vegetables.",
            translation: "بالطبع، يتضمن الفواكه والخضروات",
        },
        {
            audio: "What else.mp3",
            English: "What else?",
            translation: "ماذا أيضًا؟",
        },
        {
            audio:"Well.mp3",
            English: "Well.",
            translation: "حسنًا",
            
        },

        {
            audio: "It also includes foods.mp3",
            English: "It also includes foods.",

            
        },
        {
            audio:"foods like whole grain cereals and oily fish.mp3",
            English: "foods like whole grain cereals and oily fish.",
            translation: "أطعمة مثل الحبوب الكاملة والأسماك الزيتية",
        },
        
        {
            audio: "It also includes foods like whole grain cereals and oily fish.mp3",
            English: "It also includes foods like whole grain cereals and oily fish.",
            translation: "كما يتضمن أطعمة مثل الحبوب الكاملة والأسماك الزيتية",
            
        },

    ];

    let currentAudioIndex = 0;

    const propertyHandlers = {
        English: (value) => `<details><summary>English Script:</summary><p class="english">${value}</p></details>`,
        translation: (value) => `<details><summary>Translation:</summary><p class="arabic">${value}</p></details>`,
    };

    const audioPlayer = document.getElementById("audioPlayer");
    audioPlayer.src = Items[currentAudioIndex].audio;

    function displayData() {
        const slideContainer = document.querySelector(".slide");
        slideContainer.innerHTML = `<p>Sound Clip: ${currentAudioIndex + 1} of ${Items.length}</p>`;
        audioPlayer.src = Items[currentAudioIndex].audio;

        for (const key in Items[currentAudioIndex]) {
            const value = Items[currentAudioIndex][key];
            if (propertyHandlers[key] && value !== undefined) {
                slideContainer.innerHTML += propertyHandlers[key](value);
            }
        }
    }

    function clearFeedback() {
        document.getElementById("feedback").innerHTML = '';
        document.getElementById("userTranslation").value = ''; // Clear the text area
    }

    function nextSlide() {
        currentAudioIndex = (currentAudioIndex + 1) % Items.length;
        clearFeedback();
        displayData();
        audioPlayer.play();
    }

    function previousSlide() {
        currentAudioIndex = (currentAudioIndex - 1 + Items.length) % Items.length;
        clearFeedback();
        displayData();
        audioPlayer.play();
    }

    function goToSlide() {
        const input = document.getElementById("slideInput").value;
        const index = parseInt(input) - 1;
        if (index >= 0 && index < Items.length) {
            currentAudioIndex = index;
            clearFeedback();
            displayData();
        } else {
            alert("Please enter a valid slide number.");
        }
    }

    function checkAnswer() {
        const userTranslation = document.getElementById("userTranslation").value.trim();
        const correctAnswer = Items[currentAudioIndex].English; // Check against the English text
        const feedback = document.getElementById("feedback");
        feedback.innerHTML = '';

        if (userTranslation === correctAnswer) {
            feedback.innerHTML = "&#10004;"; // Show tick mark for correct answer
            feedback.style.color = "green"; // Indicate success
            speakCorrectAnswer(correctAnswer); // Convert correct answer to speech
        } else {
            let result = '';
            const userWords = userTranslation.split(' ');
            const correctWords = correctAnswer.split(' ');

            for (let i = 0; i < correctWords.length; i++) {
                if (userWords[i] === correctWords[i]) {
                    result += correctWords[i] + ' '; // Keep correct words
                } else {
                    result += '*'.repeat(correctWords[i].length) + ' '; // Replace incorrect words with asterisks
                }
            }
            feedback.innerHTML = result.trim(); // Show modified translation
            feedback.style.color = "red"; // Indicate that the user needs to correct their answer
        }
    }

    function speakCorrectAnswer(answer) {
        utterance.text = answer; // Set the text to be spoken
        window.speechSynthesis.speak(utterance); // Speak the text
    }

    displayData();
</script>
<footer>
    <p>&#169; 2025 Eltayeb Mohamed.<br> All rights reserved.</p>
</footer>
</body>
</html>
